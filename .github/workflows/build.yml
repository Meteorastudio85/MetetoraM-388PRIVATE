name: Build VST3
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dsp-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test del nucleo DSP
        run: clang++ -O2 -std=c++17 Tests/dsp_test.cpp -o dsp_test && ./dsp_test

  build:
    needs: dsp-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest,   name: macOS }
    runs-on: ${{ matrix.os }}
    name: VST3 ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        shell: bash
        run: |
          ARGS=(-B build -DCMAKE_BUILD_TYPE=Release)
          if [ "$RUNNER_OS" = "macOS" ]; then ARGS+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"); fi
          cmake "${ARGS[@]}"
      - name: Compila
        run: cmake --build build --config Release --target M388_VST3 --parallel
      - name: Carica il VST3
        uses: actions/upload-artifact@v4
        with:
          name: M388-VST3-${{ matrix.name }}
          path: build/M388_artefacts/Release/VST3

  # Solo quando pubblichi un tag che inizia con "v" (es. v0.2.0): crea una Release con gli zip Windows e macOS pronti da scaricare
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Comprimi
        run: cd dist && for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
